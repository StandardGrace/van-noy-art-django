{% extends "pages/base.html" %}

{% block title %}Add Student{% endblock %}

{% block content %}
    <h2>Student Registration</h2>

    <form method="POST">
        {% csrf_token %}

        <label for="student_name">Student Name:</label>
        <input type="text" id="student_name" name="student_name" required><br>

        <label for="student_age">Age:</label>
        <input type="number" id="student_age" name="student_age" required><br>

        <label for="student_city">City:</label>
        <input type="text" id="student_city" name="student_city" required><br>

        <label for="student_email">Email:</label>
        <input type="email" id="student_email" name="student_email" required><br>

        <label for="student_phone">Phone:</label>
        <input type="text" id="student_phone" name="student_phone" required><br>

        <label for="student_subject">Subject:</label>
        <input type="text" id="student_subject" name="student_subject" required><br>

        <label for="student_grade">Grade:</label>
        <input type="text" id="student_grade" name="student_grade" required><br>

        <label for="student_hobby">Hobby:</label>
        <input type="text" id="student_hobby" name="student_hobby" required><br>

        <label for="student_address">Address:</label>
        <input type="text" id="student_address" name="student_address" required><br>

        <label for="enrollment_year">Enrollment Year:</label>
        <input type="number" id="enrollment_year" name="enrollment_year" required><br>

        <button type="submit">Save Student</button>
    </form>
{% endblock %}
